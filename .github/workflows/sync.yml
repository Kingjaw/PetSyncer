name: PetPoint to RescueGroups Sync

on:
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch: 

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run sync script
        env:
          RGUSER: ${{ secrets.RGUSER }}
          RGPASSWORD: ${{ secrets.RGPASSWORD }}
          RGACCNUM: ${{ secrets.RGACCNUM }}
          PPAUTHKEY: ${{ secrets.PPAUTHKEY }}
          RGAUTH: ${{ secrets.RGAUTH }}
          WEBSHAREKEY: ${{ secrets.WEBSHAREKEY }}
        run: python finalSyncer.py > output.txt
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-summary-${{ github.run_id }}
          path: output.txt
          retention-days: 30
          
      - name: Get current date
        id: date
        run: echo "today=$(TZ='America/New_York' date +'%B %d, %Y')" >> "$GITHUB_OUTPUT"

      - name: Make email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Automatic sync results for ${{ steps.date.outputs.today }}"
          to: ${{ secrets.OUTBOUND_EMAIL }}
          from: Pet Syncer
          body: "Attached are the results of the automatic sync for today."
          attachments: output.txt

