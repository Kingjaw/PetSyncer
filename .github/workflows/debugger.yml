name: Proxy debug

on:
  workflow_dispatch:   # adds a manual "Run workflow" button

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: curl through proxy
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          curl -v -m 30 -x "$PROXY_URL" https://api.rescuegroups.org/ || true
